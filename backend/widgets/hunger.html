<style>
body{margin:0;padding:10px;font-family:system-ui,sans-serif;color:var(--tg-theme-text-color);font-size:12px}
*{box-sizing:border-box}[hidden]{display:none!important}button{font-family:inherit;cursor:pointer}button:disabled{cursor:default}
.heading{display:flex;align-items:center;gap:6px}.heading strong{flex:1;min-width:0;font-size:14px;font-weight:700}.coins{color:#d78a0a;font-size:11px;font-weight:700;white-space:nowrap}
.hint{font-size:11px;color:var(--tg-theme-hint-color);margin:3px 0 8px}.list{display:flex;flex-direction:column;gap:8px}.meals{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.meal{width:100%;min-width:0;min-height:52px;padding:7px 4px;border-radius:9px;background:var(--tg-theme-secondary-bg-color);border:1px solid var(--edge);text-align:center;color:var(--tg-theme-text-color)}
.emoji{font-size:16px;vertical-align:-1px}.name{font-size:12px;font-weight:600;white-space:nowrap}.effect{font-size:10px;line-height:14px;color:var(--tg-theme-hint-color);display:block;margin-top:3px}.price{color:var(--food);font-weight:700;font-size:11px;white-space:nowrap}
.meal:disabled{border-color:var(--tg-theme-section-separator-color);opacity:.6}.meal:active:not(:disabled){transform:scale(.99)}
.fridge{padding:8px;border:1px solid rgba(74,163,255,.25);border-radius:9px}.stocked{padding:0;border:0}.row{display:flex;align-items:center;justify-content:space-between;gap:6px}.row .effect{margin:0}.plans{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.plan{min-height:34px;border-radius:8px;border:1px solid rgba(74,163,255,.28);background:rgba(74,163,255,.1);color:#4aa3ff;font-size:11px;font-weight:600;padding:6px 4px}.plan:disabled{color:var(--tg-theme-hint-color);opacity:.55}.buy{width:100%;text-align:left;padding:8px}.buy .price{float:right}
#note{font-size:11px;line-height:1.35;margin:6px 0 0;color:var(--tg-theme-hint-color);overflow-wrap:anywhere}.refresh{background:transparent;border:0;color:var(--tg-theme-link-color);font-size:16px;min-height:28px;min-width:24px;padding:0}.confirm p{font-size:12px;line-height:1.4;margin:8px 0;color:var(--tg-theme-hint-color)}.actions{display:flex;gap:6px}.actions button{flex:1}.primary{background:var(--tg-theme-button-color);color:var(--tg-theme-button-text-color)}
@media(max-width:250px){body{padding:8px}.meal .emoji{font-size:13px}.name{font-size:10px}.meal{padding:6px 3px}.heading strong{font-size:11px}.meals{gap:4px}.effect{font-size:9px}.plan{min-height:32px;font-size:10px;padding:6px 2px}}
@media(prefers-reduced-motion:reduce){.meal:active:not(:disabled){transform:none}}
</style>
<div class="heading"><strong id="title">🍽 Feed your Peeper</strong><span class="coins" id="coins"></span><button class="refresh" id="refresh" data-action="refresh" title="Refresh">↻</button></div>
<div class="hint" id="summary"></div><main id="menu" class="list"></main><section id="confirm" class="confirm" hidden></section><p id="note" hidden></p>
<script>
const W=window.TelegramWidget;
let s={},busy=false,confirmBuy=false,note='',lastRefresh=0;
const $=id=>document.getElementById(id);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colors={apple:['#e74c3c','#e74c3c40','#e74c3c22'],chicken:['#e67e22','#e67e2240','#e67e2222'],pizza:['#27ae60','#27ae6040','#27ae6022']};
function remaining(until){const m=Math.max(1,Math.ceil((until-Date.now()/1000)/60));return m>=1440?Math.floor(m/1440)+'d '+Math.floor(m%1440/60)+'h':m>=60?Math.floor(m/60)+'h '+m%60+'m':m+'m'}
function render(){
 const locked=busy||!s.a||s.x;
 $('title').textContent=confirmBuy?'🧊 Buy Fridge?':!s.a?'🐸 Peeper needs you':s.h>70?'🐸 Peeper is full':s.h<=0?'🍽 Peeper is starving':'🍽 Feed your Peeper';
 $('coins').textContent='✦ '+(s.c||0);
 $('summary').textContent='Hunger: '+Math.round(s.h||0)+'% · HP: '+Math.round(s.p||0)+'%';
 $('menu').hidden=confirmBuy;$('confirm').hidden=!confirmBuy;
 if(confirmBuy){
  $('confirm').innerHTML='<p>Permanent Fridge: <strong>'+s.fr.c+' ✦</strong>. Food is bought separately: '+s.fr.plans.map(p=>p[1]+' days for '+p[2]+' ✦').join(' or ')+'.</p><div class="actions"><button class="plan" data-action="cancel" '+(busy?'disabled':'')+'>Cancel</button><button class="plan primary" data-action="fridge_buy" '+(locked||s.c<s.fr.c?'disabled':'')+'>'+(busy?'Buying...':'Buy · '+s.fr.c+' ✦')+'</button></div>';
 }else if(s.f){
  let html=s.a&&s.h<=70?'<div class="meals">'+s.f.map(f=>{const c=colors[f[0]];return '<button class="meal" style="--food:'+c[0]+';--edge:'+c[1]+'" data-action="'+f[0]+'" '+(locked||s.c<f[3]?'disabled':'')+'><span class="name"><span class="emoji">'+esc(f[2])+'</span> '+esc(f[1])+'</span><span class="effect">+'+f[4]+'% · <span class="price">'+f[3]+' ✦</span></span></button>'}).join('')+'</div>':'';
  if(s.fr.o){html+='<div class="fridge'+(s.fr.a?' stocked':'')+'"><div class="row"><span>🧊 Fridge</span><span class="effect">'+(s.fr.a?'Stocked for '+remaining(s.fr.u):'Empty')+'</span></div>'+(s.fr.a?'':'<div class="plans">'+s.fr.plans.map(p=>'<button class="plan" data-action="'+p[0]+'" '+(locked||s.c<p[2]?'disabled':'')+'>'+p[1]+' days · '+p[2]+' ✦</button>').join('')+'</div>')+'</div>'}
  else if(s.a)html+='<button class="plan buy" data-action="buy" '+(locked?'disabled':'')+'>🧊 Buy Fridge <span class="price">'+s.fr.c+' ✦</span></button>';
  $('menu').innerHTML=html;
 }
 $('note').textContent=busy?'Updating…':note||(confirmBuy&&s.c<s.fr.c?'Not enough coins. You have '+s.c+' ✦.':!s.a?'Open Peeper to take care of your pet.':s.h<=0?'HP is draining — feed your Peeper.':'');
 $('note').hidden=!$('note').textContent;
 $('refresh').disabled=busy||Boolean(s.x);
}
function accept(next){if(next&&(s.r===undefined||next.r>s.r||next.r===s.r&&next.t>=s.t)){s=next;if(s.fr.o)confirmBuy=false}}
function read(){try{accept(JSON.parse(W.chatData))}catch(e){}render()}
function request(action){
 if(busy||!W||!s.n||s.x)return;
 busy=true;note='';render();
 W.request('care:'+s.n+':'+(action==='refresh'?'refresh':s.r+':'+action)).then(a=>{
  const result=JSON.parse(a.result||'{}');accept(result.s);if(result.x)s.x=true;note=result.m||'';
 },e=>{note=({BUSY:'Please wait, then try again.',RATE_LIMITED:'Too many requests. Wait a few seconds.',TIMEOUT:'No reply yet. Refresh before trying again.',NOT_ALLOWED:'Open this notification in your private chat with Peeper.',FAILED:'Could not connect. Please refresh.',INVALID_ANSWER:'Could not read the reply. Please refresh.'})[e.code]||'Could not update. Please refresh.'}).catch(()=>{note='Could not read the reply. Please refresh.'}).finally(()=>{busy=false;render()});
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='buy'){confirmBuy=true;render()}else if(a==='cancel'){confirmBuy=false;render()}else request(a)});
function refresh(){if(W&&!busy&&!document.hidden&&Date.now()-lastRefresh>5000){lastRefresh=Date.now();request('refresh')}}
if(W){W.onEvent('chatDataChanged',read);W.onEvent('activated',refresh);read();W.ready();refresh();setInterval(refresh,60000)}
</script>
