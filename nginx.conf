# /etc/nginx/sites-available/peeper.frenzyradio.online
# Paste this into your nginx config and enable with symlink to sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name peeper.frenzyradio.online;

    # Redirect HTTP → HTTPS (certbot will add this automatically)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name peeper.frenzyradio.online;

    # SSL — managed by certbot
    ssl_certificate     /etc/letsencrypt/live/peeper.frenzyradio.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peeper.frenzyradio.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/peeper.frenzyradio.online/html;
    index index.html;

    # Allow large file uploads (animated WebP gifts etc.)
    client_max_body_size 20m;

    # Security headers
    # Note: X-Frame-Options intentionally absent — Telegram Web opens Mini Apps in iframes
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── API → backend (Node.js on port 4000) ───────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Pass through Telegram auth header
        proxy_pass_request_headers on;
    }

    # ── Static React app ────────────────────────────────────────────────
    location / {
        # Serve static files; fallback to index.html for SPA routing
        try_files $uri $uri/ /index.html;

        # Never cache index.html — always fetch fresh so new JS bundles load
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Cache hashed JS/CSS/assets aggressively (Vite adds content hash to filename)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
